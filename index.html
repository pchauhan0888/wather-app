<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wether app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name" spellcheck="false">
            <button><img src="cloud-solid-full.svg" </button>
        </div>
        <div class="weather">
            <img src="cloud-solid-full.svg" class="weather-icon">
            <h1 class="tem">23°C
                <h2 class="city">khurja</h2>
                <div class="details">
                    <div class="col">
                        <img src="water-solid-full.svg">
                        <div>
                            <p class="humidity">60%</p>
                            <p>humidity</p>
                        </div>
                    </div>
                     <div class="col">
                        <img src="water-solid-full.svg">
                        <div>
                            <p class="wind">40 km/h</p>
                            
                             
                            <p>wind speed</p>
                        </div>
                </div>

            </h1> 
        </div>
    </div>
</body>
</html>
